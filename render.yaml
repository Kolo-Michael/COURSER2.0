# COURSER API - Render Deployment (render.yaml)
# 
# 1. Go to https://dashboard.render.com → New → Blueprint
# 2. Connect this repo
# 3. Render will auto-detect the services

services:
  - type: web
    name: courser-api
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: APP_ENV
        value: production
      - key: FRONTEND_ORIGINS
        value: https://courser-2-0.vercel.app
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: FROM_EMAIL
        sync: false