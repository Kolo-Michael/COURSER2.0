# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploys the COURSER FastAPI backend as a Web Service that talks to an
# EXISTING Neon PostgreSQL database. Render does NOT provision a managed
# Postgres here — the DATABASE_URL is supplied by you (see step 3 below).
# The frontend is NOT included (deploy separately).
#
# How to use:
#   1. Push this file to GitHub.
#   2. In Render Dashboard → New → Blueprint → pick this repo.
#   3. Render reads render.yaml and creates the web service. Before the
#      first deploy, open the service's Environment tab and paste your
#      Neon connection string into DATABASE_URL, e.g.:
#        postgresql+asyncpg://USER:PASS@ep-xxxx-pooler.REGION.aws.neon.tech/Courser?sslmode=require
#      Use the pooler endpoint, keep the +asyncpg driver segment, and
#      leave sslmode=require in the query string (the app reads it).
#   4. Watch the deploy log: `preDeployCommand: python init_db.py` creates
#      the schema in Neon (idempotent — safe to re-run on every deploy).
#   5. Optional: run create_super_admin / seed_courses from a local shell
#      pointed at the same Neon URL to populate the starter catalog.
#
# Local dev still uses backend/.env / uvicorn — this file only matters for Render.

services:
  - type: web
    name: courser-api
    runtime: python
    plan: free
    rootDir: backend
    # Render's Python runtime autodetects a WSGI/ASGI app if you give it
    # the right start command. We pin uvicorn explicitly to control host/port
    # and proxy-headers (Render sits behind a TLS-terminating load balancer).
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # preDeployCommand runs before each deploy on Render's free tier (no
    # shell needed). init_db.py creates tables in Neon idempotently; safe
    # to re-run. seed_courses / create_super_admin stay manual — run them
    # once after the very first deploy from a local shell with the same
    # production DATABASE_URL exported.
    preDeployCommand: python init_db.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      # DATABASE_URL points at the user's existing Neon PostgreSQL project
      # (pooler endpoint, sslmode=require). Empty by default — paste your
      # Neon string into the service's Environment tab before first deploy.
      # Example shape:
      #   postgresql+asyncpg://USER:PASS@ep-xxxx-pooler.REGION.aws.neon.tech/Courser?sslmode=require
      - key: DATABASE_URL
        value: ""
      - key: SECRET_KEY
        generateValue: true   # Render generates a random value on first deploy
      - key: PYTHON_VERSION
        value: "3.12.0"
      # Comma-separated allowlist for browser origins. Set to your deployed
      # frontend URL once you have one (Vercel/Netlify/etc.). Localhost
      # origins are already allowed in main.py.
      - key: FRONTEND_ORIGINS
        value: ""