# COURSER API - Fly.io Deployment
# 
# 1. Install flyctl: curl -L https://fly.io/install.sh | sh
# 2. Run: fly launch --name courser-api --dockerfile backend/Dockerfile
# 3. Set secrets: fly secrets set DATABASE_URL=... SECRET_KEY=... APP_ENV=production FRONTEND_ORIGINS=https://courser-2-0.vercel.app
# 4. Deploy: fly deploy

app = "courser-api"
primary_region = "iad"

[build]
  dockerfile = "backend/Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[env]
  APP_ENV = "production"
  FRONTEND_ORIGINS = "https://courser-2-0.vercel.app"