# Frontend — Netlify
# Netlify reads this from the repo root and deploys frontend/ as a static site.
# The FastAPI backend lives on Fly.io (see fly.toml); this file is just the
# frontend half.

[build]
  base = "frontend"
  command = "npm install && npm run build"
  publish = "dist"

# SPA fallback — every non-asset path serves index.html so React Router works
# on hard refreshes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optional: proxy /api/* through Netlify to Fly.io if you want same-origin
# cookies. Without this block, the frontend talks to Fly directly via
# VITE_API_BASE_URL and you handle CORS in the backend.
#
# [[redirects]]
#   from = "/api/*"
#   to = "https://courser-api.fly.dev/api/:splat"
#   status = 200
#   force = true