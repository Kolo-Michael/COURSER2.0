# Keep the Vercel Python Function warm and dodge cold starts.
#
# Vercel Hobby Functions go idle and pay a cold-start cost on the next
# request. Pinging /api/health on a schedule keeps the Python runtime warm.
# This runs in GitHub Actions — free (unlimited on public repos) and needs
# no third-party account.
#
# Notes:
#   * `schedule` uses UTC and is approximate; GitHub may delay a run under
#     load, so treat an external monitor (README) as a backup if you still
#     see cold starts.
#   * GitHub disables scheduled workflows after ~60 days of repo inactivity
#     — any push to main re-enables them.
#   * Override the URL with a repo Variable named HEALTH_URL if the app
#     moves off its default vercel.app host.

name: Keep Vercel API warm

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          URL="${HEALTH_URL:-https://courser2.vercel.app/api/health}"
          echo "Pinging $URL"
          curl -fsS -m 30 -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" "$URL"
