# Keep the Render Python API warm and dodge cold starts.
#
# Render free instances go idle after ~15 minutes and pay a cold-start
# cost on the next request. Pinging /api/health on a schedule keeps the
# Python runtime warm. This runs in GitHub Actions — free and needs no
# third-party account. cron-job.org (backend/cronjob_org_setup.md) is a
# cloud backup that runs even when this repo is inactive.
#
# Notes:
#   * `schedule` uses UTC and is approximate; GitHub may delay a run under
#     load, so treat cron-job.org (README) as a backup if you still see
#     cold starts.
#   * GitHub disables scheduled workflows after ~60 days of repo inactivity
#     — any push to main re-enables them.
#   * Override the URL with a repo Variable named HEALTH_URL if the app
#     moves off its default onrender.com host.

name: Keep Render API warm

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          URL="${HEALTH_URL:-https://courser-api-18uo.onrender.com/api/ping}"
          echo "Pinging $URL"
          curl -fsS -m 30 -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" "$URL"
