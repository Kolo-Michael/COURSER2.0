  <text x="584" y="321" text-anchor="end" font-size="13" font-weight="600" fill="#FFFFFF" fill-opacity="0.85" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">COURSER 2.0</text>
